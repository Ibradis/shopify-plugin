# Blueprint Render : service web Remix + base PostgreSQL gérée.
# Render > New > Blueprint > choisir ce dépôt.
#
# Les variables marquées `sync: false` sont des secrets : Render les demande
# à la création, elles ne sont jamais versionnées.

databases:
  - name: djomy-db
    databaseName: djomy
    user: djomy
    plan: free
    region: frankfurt

services:
  - type: web
    name: djomy-shopify
    runtime: node
    plan: free
    region: frankfurt
    # `--include=dev` : le build Remix et le CLI Prisma sont des
    # dépendances de développement, écartées quand NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # `setup` génère le client Prisma et applique les migrations en attente.
    startCommand: npm run setup && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 22.17.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: djomy-db
          property: connectionString
      - key: SCOPES
        value: write_orders,read_orders
      - key: DJOMY_BASE_URL
        value: https://sandbox-api.djomy.africa
      - key: DJOMY_COUNTRY_CODE
        value: GN
      - key: DJOMY_TIMEOUT_MS
        value: 15000
      # --- Secrets, saisis dans Render ---
      - key: SHOPIFY_API_KEY
        sync: false
      - key: SHOPIFY_API_SECRET
        sync: false
      # URL publique du service, ex. https://djomy-shopify.onrender.com
      - key: SHOPIFY_APP_URL
        sync: false
      # openssl rand -base64 32 — à conserver : la perdre rend illisibles
      # les secrets marchands déjà chiffrés en base.
      - key: ENCRYPTION_KEY
        sync: false
      - key: DJOMY_CLIENT_ID
        sync: false
      - key: DJOMY_CLIENT_SECRET
        sync: false
